name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Sync dependencies (CPU-only torch)
        run: uv sync --frozen --no-install-project --extra dev || uv sync --extra dev

      - name: Install project
        run: uv pip install -e .

      - name: Ruff (lint)
        run: uv run ruff check src tests scripts

      - name: Ruff (format check)
        run: uv run ruff format --check src tests scripts

      - name: Pytest (fast suite, slow tests skipped)
        run: uv run pytest tests/ -m "not slow" -v

  quarto-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.5.57

      - name: Render website (smoke)
        run: quarto render website --to html --execute=false
        env:
          QUARTO_LOG_LEVEL: warning
